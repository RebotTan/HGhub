name: Release

# 打 tag（v1.2.3）即自动出包并发布 Release；也可以在 Actions 页手动跑一次只出产物。
# 发布/失败后的手机通知：在仓库 Secrets 里加 NTFY_TOPIC（自建服务器再加 NTFY_SERVER），
# 用任意 ntfy 客户端订阅同名 topic 即可；不配则只在 Actions 页面留结论。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:

  # ================= Android：按 ABI 分包 + 签名 =================
  android:
    name: Android (split per ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 版本号对齐 tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu runner 自带 Android SDK，不再用 android-actions/setup-android（它的 license 交互会卡住）
      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 APK（按 ABI 分包）
        run: pnpm tauri android build --apk --target aarch64

      - name: 诊断密钥（临时）
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "p12 sha256: $(echo "$KEYSTORE_BASE64" | base64 -d | sha256sum)"
          echo "pwd sha256: $(printf %s "$STORE_PASSWORD" | sha256sum)"
          echo "pwd len: $(printf %s "$STORE_PASSWORD" | wc -c)"

      - name: 签名 APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 ANDROID_KEY_BASE64 secret，无法签名"; exit 1
          fi
          KS="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          # 上传的是 PKCS12；apksigner 默认按 JKS 解析，先用 keytool 转一次
          keytool -importkeystore -noprompt             -srckeystore "$KS" -srcstoretype PKCS12 -srcalias "$KEY_ALIAS" -srcstorepass "$STORE_PASSWORD"             -destkeystore "$RUNNER_TEMP/release.jks" -deststoretype JKS -deststorepass "$STORE_PASSWORD"             -destkeypass "$KEY_PASSWORD" -destalias "$KEY_ALIAS"
          KS="$RUNNER_TEMP/release.jks"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          mkdir -p artifacts
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            out="artifacts/HGhub_${VERSION}_${abi}.apk"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -3
            found=$((found+1))
          done
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release.p12"
          if [ "$found" -eq 0 ]; then echo "::error::没有找到 release APK"; exit 1; fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*
          if-no-files-found: error

  # ================= 发布 =================
  release:
    name: Publish GitHub Release
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ================= 通知 =================
  # 无需 token：ntfy 匿名 topic 即可。配了 NTFY_TOPIC 才推送，没配就只写 job summary。
  notify:
    name: Notify
    needs: [android, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 推送结果
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          SERVER: ${{ secrets.NTFY_SERVER }}
          ANDROID: ${{ needs.android.result }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BASE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if [ "$ANDROID" != "success" ]; then
            TITLE="HGhub build failed ($REF)"; LINK="$BASE/actions/runs/$GITHUB_RUN_ID"; PRIO=high; TAG=x
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TITLE="HGhub $REF released"; LINK="$BASE/releases/tag/$REF"; PRIO=default; TAG=white_check_mark
          else
            TITLE="HGhub build ok ($REF)"; LINK="$BASE/actions/runs/$GITHUB_RUN_ID"; PRIO=low; TAG=package
          fi
          {
            echo "### $TITLE"
            echo "$LINK"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${TOPIC:-}" ]; then
            echo "::notice::未配置 secrets.NTFY_TOPIC，跳过推送"
            exit 0
          fi
          curl -fsS -X POST "${SERVER:-https://ntfy.sh}/$TOPIC"             -H "Title: $TITLE" -H "Priority: $PRIO" -H "Tags: $TAG" -H "Click: $LINK"             -d "$LINK" || echo "::warning::ntfy 推送失败（不影响构建结果）"
