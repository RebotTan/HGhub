[package]
name = "huangguo-client"
version = "1.2.0"
description = "HGhub · 黄果短剧客户端"
authors = ["HGhub"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "huangguo_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
# 注意：system-proxy 必须显式列出——关掉 default-features 会连带丢掉它。
# Android 本身读不到系统代理，但保留该 feature 不改变现有连接行为，见 src/net.rs 顶部说明。
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
  "gzip",
  "brotli",
  "json",
  "charset",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
